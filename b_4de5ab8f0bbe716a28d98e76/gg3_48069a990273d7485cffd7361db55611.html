function previewCandidates(card){
 const raw=String(card.url||'').trim();
 const isImage=card.type==='image'||/[.](?:png|jpe?g|gif|webp|avif)(?:[?#]|$)/i.test(raw);
 let cover='';try{cover=sitePreviewCovers[new URL(raw).hostname]||''}catch{}
 return [...new Set((isImage?[raw,card.preview]:[card.preview,...(card.previewAlternates||[]),cover]).filter(Boolean))];
}
function makeResourcePreview(card,previewLink){
 const candidates=previewCandidates(card);
 if(!candidates.length){previewLink.hidden=true;return document.createDocumentFragment()}
 const img=el('img','preview');
 img.alt='';img.loading='lazy';img.decoding='async';img.referrerPolicy='no-referrer';
 img.width=252;img.height=164;
 previewLink.title=card.title||'Открыть материал';
 let index=0;
 img.onerror=()=>{
  if(++index<candidates.length){img.src=candidates[index];return}
  previewLink.hidden=true;img.remove();
 };
 img.src=candidates[0];return img;
}

function render(){renderNav();document.getElementById('tabTitle').textContent=activeTab.name;document.getElementById('smallTitle').textContent=activeTab.name.toLocaleLowerCase('ru');const q=search.value.trim().toLocaleLowerCase('ru');let visibleCards=0;const sections=[];for(const section of activeTab.sections){const cards=(section.cards||[]).filter(card=>!q||[card.title,card.description,card.service].join(' ').toLocaleLowerCase('ru').includes(q));if(!cards.length)continue;visibleCards+=cards.length;const sectionEl=el('section','column');const head=el('header','column-head');head.append(el('h3','column-title',section.title),el('span','column-count',String(cards.length).padStart(2,'0')));const list=el('div','cards');for(const card of cards){const cardEl=el('article','card');cardEl.title=[card.title,card.description].filter(Boolean).join(' — ');const previewLink=el('a','preview-link');previewLink.href=card.url||'#';previewLink.target='_blank';previewLink.rel='nofollow noopener noreferrer';previewLink.append(makeResourcePreview(card,previewLink));const body=el('div','card-body');body.append(el('div','service',card.service||card.type||'Материал'),el('h4','card-title',card.title||'Материал'));if(card.description)body.append(el('p','description',card.description));if(card.type==='audio'){const audio=el('audio','audio-control');audio.controls=true;audio.preload='none';audio.src=card.url;body.append(audio)}else{const actions=el('div','card-actions');for(const item of cardLinks(card)){const action=el('a','card-action'+(item.alt?' alt':''),item.label+' ↗');action.href=item.url;action.target='_blank';action.rel='nofollow noopener noreferrer';actions.append(action)}body.append(actions)}cardEl.append(previewLink,body);list.append(cardEl)}sectionEl.append(head,list);sections.push(sectionEl)}boardEl.replaceChildren(...sections);const isEmpty=!sections.length;boardEl.classList.toggle('hidden',isEmpty);empty.classList.toggle('hidden',!isEmpty);document.getElementById('tabStats').textContent=String(visibleCards).padStart(2,'0')+' материалов · '+String(sections.length).padStart(2,'0')+' секций';document.getElementById('boardWrap').scrollTo({top:0})}
search.addEventListener('input',render);window.addEventListener('hashchange',()=>{const next=data.tabs.find(t=>String(t.id)===location.hash.slice(1));if(next&&next.id!==activeTab.id){activeTab=next;search.value='';render()}});render();
